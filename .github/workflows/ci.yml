name: CI

# S1-03 (docs/orchestration/sprint-1.md), per 08-execution-plan.md §7-8 and
# 02-architecture.md §9: nothing reaches main without passing lint, types and
# tests (NFR-14). Deployment and staging promotion are out of scope here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .nvmrc / package.json "engines" and "packageManager".
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # Unchanged packages skip work: Turbo hashes each task's own
          # inputs, so a key per workflow run (with a branch-scoped
          # restore-key) is enough to reuse untouched packages' outputs.
          key: turbo-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-checks-${{ github.ref_name }}-
            turbo-${{ runner.os }}-checks-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    services:
      # Mirrors infra/docker/docker-compose.yml so CI matches local dev.
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: tutor_link
          POSTGRES_PASSWORD: tutor_link_ci
          POSTGRES_DB: tutor_link
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor_link -d tutor_link"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tutor_link:tutor_link_ci@localhost:5432/tutor_link
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-api-integration-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-api-integration-${{ github.ref_name }}-
            turbo-${{ runner.os }}-api-integration-

      - name: Run database migrations
        # S1-04: applies infra/db/roles.sql then every Prisma migration,
        # against this job's fresh Postgres container.
        run: pnpm db:migrate

      - name: Seed database
        # Exercises the seed script in CI too (it is also run twice by
        # test:integration's seed-idempotency.integration-spec.ts).
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm --filter @tutor-link/api test

      - name: API integration tests (DB-backed)
        # S1-04: migrations, grants, schema shape and seed idempotency,
        # against the live Postgres/Redis service containers above.
        # S1-05 adds application-level DB-backed tests here too.
        run: pnpm --filter @tutor-link/api test:integration

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (prod, high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Playwright harness lands in S1-12 (docs/orchestration/sprint-1.md).
    # Job kept here, skipped, so the pipeline shape is already in place.
    if: false
    steps:
      - run: echo "Playwright e2e harness lands in S1-12"
